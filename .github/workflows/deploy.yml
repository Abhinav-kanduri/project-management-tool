name: Validate and Deploy ReleaseLens

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: releaselens-production
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  OPENAI_API_KEY: workflow-validation-key
  DATABASE_URL: postgresql://workflow:workflow@127.0.0.1:5432/workflow

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app main.py

      - name: Validate browser JavaScript
        run: node --check app/static/app.js

      - name: Verify application import
        run: python -c "from main import app; assert app.title == 'ReleaseLens API'"

      - name: Run health smoke test
        shell: bash
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done

          cat uvicorn.log
          exit 1

      - name: Package deployment artifact
        if: github.event_name != 'pull_request'
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.env' \
            -czf releaselens-backend-${{ github.sha }}.tar.gz .

      - name: Upload deployment artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: releaselens-backend-${{ github.sha }}
          path: releaselens-backend-${{ github.sha }}.tar.gz
          retention-days: 14
          if-no-files-found: error

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Trigger hosting-provider deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "DEPLOY_HOOK_URL is not configured; validation succeeded but deployment was skipped."
            echo "Add the provider deploy hook as a production environment secret to enable deployment."
            exit 0
          fi

          curl \
            --fail \
            --show-error \
            --silent \
            --retry 3 \
            --retry-all-errors \
            --request POST \
            "$DEPLOY_HOOK_URL"

      - name: Verify production health
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ] || [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "Production health verification was skipped because deployment settings are incomplete."
            exit 0
          fi

          for attempt in {1..30}; do
            if curl --fail --silent "${PRODUCTION_URL%/}/health" | grep -q '"status":"ok"'; then
              echo "Production is healthy."
              exit 0
            fi
            sleep 10
          done

          echo "Production health check timed out."
          exit 1
